# compose-launcher config for NatePy (https://github.com/Nate314/NatePy)
# The launcher requires at least one port line, but this console program serves nothing.
# UNUSED_PORT only satisfies that rule: docker-compose.yml does not read it and publishes no ports.
port UNUSED_PORT 8080

url No web page: the container transpiles Assignment2.npy and runs it, waiting for input.
url Interact: .\run.ps1 attach natepy   or   ./run.sh attach natepy (the first prompt is already on screen: type an answer)
url Output so far: .\run.ps1 logs natepy   or   ./run.sh logs natepy
